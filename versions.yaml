# Source of truth for the Packer toolchain.
# Never hand-edited: the detect workflow opens PRs against this file.
#
# Only versions live here. Signing keys, upstream locations and the soak
# period are in policy/trust.yaml, which a bump PR cannot touch.
# Who approved each promotion is recorded next to the artifacts in Nexus
# (promotion.json) and in the artifact-promotion deployment history.

packer:
  version: "1.16.1"
plugins:
  vsphere:
    source: github.com/vmware/vsphere
    version: "2.5.0"
    api_version: "x5.0"
  ansible:
    source: github.com/hashicorp/ansible
    version: "1.1.6"
    api_version: "x5.0"
