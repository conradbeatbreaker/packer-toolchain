name: Promote to Nexus

# Runs after a bump merges. The `artifact-promotion` environment is where
# the human approval actually happens: GitHub blocks this job until a
# designated reviewer approves, and records who and when against the run.

on:
  push:
    branches: [main]
    paths:
      - "versions.yaml"
  workflow_dispatch:
  # TODO: remove workflow_dispatch once testing is done. A manual promote
  # skips the PR gate.

permissions:
  contents: read
  actions: read          # record-approval.sh reads this run's approvals

jobs:
  promote:
    # Must reach Nexus. In prod, give promotion its own runner and label:
    # build jobs run arbitrary template code on theirs, and this job holds
    # the account that can add to packer-hosted.
    runs-on: [self-hosted, linux, packer]
    environment: artifact-promotion    # <-- required reviewers configured here
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-run gate criteria
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/gate.sh "${{ github.event.before || 'HEAD^1' }}"
        # Deliberately repeated. The PR gate ran against the PR head;
        # this runs against what actually merged.

      - name: Record approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/record-approval.sh "$RUNNER_TEMP/promotion.json"
        # Approver comes from this run's environment approval, not
        # github.actor (that's whoever merged). Fails if there isn't one.

      - name: Fetch via proxy, verify, upload to packer-hosted
        env:
          NEXUS_URL: ${{ vars.NEXUS_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_PROMOTE_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PROMOTE_PASS }}
        run: ./scripts/promote.sh "$RUNNER_TEMP/promotion.json"
        # Uploads zip + SHA256SUMS + .sig + promotion.json to
        # packer-hosted/<product>/<version>/. Redeploy is disabled, so a
        # replay fails loudly rather than silently overwriting.

  notify-consumers:
    needs: promote
    runs-on: [self-hosted, linux, packer]
    strategy:
      matrix:
        repo:
          - conradbeatbreaker/packer-controls-windows-image
          # add further image repos here
    steps:
      - name: Open bump PR in consumer repo
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_PR_TOKEN }}
        run: |
          gh workflow run bump-toolchain.yml \
            --repo "${{ matrix.repo }}" \
            --ref main \
            --field toolchain_sha="${{ github.sha }}"
        # Pattern A: each image repo gets a PR and approves its own bump.
        # Nothing is pushed into a consumer without review there.
