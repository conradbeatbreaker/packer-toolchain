name: Gate

# Runs on any PR touching versions.yaml. All six criteria must pass.
# Also enforces that a bump PR touches ONLY versions.yaml (and waivers/) —
# a PR that edits the gate itself must not be reviewable as a routine bump.

on:
  pull_request:
    paths:
      - "versions.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  scope-check:
    name: PR touches only versions.yaml and waivers/
    runs-on: [self-hosted, linux, packer]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if the diff reaches beyond versions.yaml and waivers/
        run: ./scripts/check-pr-scope.sh "${{ github.event.pull_request.base.sha }}"
        # Catches a PR that weakens the gate while bumping a version.

  criteria:
    name: Gate criteria
    runs-on: [self-hosted, linux, packer]
    needs: scope-check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run criteria
        id: run
        env:
          GH_TOKEN: ${{ github.token }}   # GitHub API rate limit for release metadata
        run: ./scripts/gate.sh "${{ github.event.pull_request.base.sha }}"
        # See the header of scripts/gate.sh for the six criteria. Keys and the
        # soak period come from policy/trust.yaml, imported into a throwaway
        # keyring per check — never fetched at runtime.
        #
        # Security-fix waiver: criterion 5 only, and only via a file in
        # waivers/ matching this exact component and version. Not a label:
        # GitHub can't restrict who applies a label. CODEOWNERS on waivers/
        # decides who can grant one.

      - name: Post results to the PR
        if: always() && steps.run.outputs.report != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gate
          message: ${{ steps.run.outputs.report }}
