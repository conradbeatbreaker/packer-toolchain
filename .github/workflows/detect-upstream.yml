name: Detect upstream versions

# Scheduled poll of upstream releases. Opens a PR against versions.yaml
# when something newer is available. No approval, no promotion — just a PR.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: [self-hosted, linux, packer]
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream for newer versions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}   # GitHub API rate limit for release metadata
        run: ./scripts/detect-upstream.sh
        # Proposes the newest stable release past the soak period, writes
        # versions.yaml in place and sets outputs:
        #   changed=true|false
        #   summary=<markdown list of what moved, and what is still soaking>

      - name: Open PR
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # Fixed branch: a new run supersedes the open PR instead of
          # stacking a second one that conflicts on the same lines.
          branch: bump/toolchain
          delete-branch: true
          title: "Bump Packer toolchain"
          body: |
            Automated version bump proposed by the detect workflow.

            ${{ steps.check.outputs.summary }}

            The gate workflow will post criteria results below.
            Do not merge until all six criteria pass.
          labels: toolchain-bump
          commit-message: |
            Bump Packer toolchain

            Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
